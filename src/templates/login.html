{% extends 'base.html' %}
{% block title %}Login | Marks Manager{% endblock %}
{% block course_header %}{% endblock %}
{% block content %}
<div class="flex items-center justify-center py-12">
  <div class="w-full max-w-md bg-base-100 rounded-xl shadow-md p-8 flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center">Login</h2>

    {% if error %}
    <div class="alert alert-error">
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/login" class="flex flex-col gap-4">
      <div class="form-control">
        <label class="label" for="username">
          <span class="label-text">Username</span>
        </label>
        <input type="text" id="username" name="username" required
          class="input input-bordered w-full" />
      </div>

      <div class="form-control">
        <label class="label" for="password">
          <span class="label-text">Password</span>
        </label>
        <input type="password" id="password" name="password" required
          class="input input-bordered w-full" />
      </div>

      <button type="submit" class="btn btn-primary w-full">Login</button>
    </form>

    <p class="text-center text-sm">
      Don't have an account?
      <a href="/signup" class="link link-primary">Sign up here</a>
    </p>
  </div>
</div>
{% endblock %}
