{% extends 'base.html' %}
{% block title %}Sign Up | Marks Manager{% endblock %}
{% block course_header %}{% endblock %}
{% block content %}
<div class="flex items-center justify-center py-12">
  <div class="w-full max-w-md bg-base-100 rounded-xl shadow-md p-8 flex flex-col gap-4">
    <h2 class="text-2xl font-bold text-center">Create Account</h2>

    {% if error %}
    <div class="alert alert-error">
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/signup" class="flex flex-col gap-4">
      <div class="form-control">
        <label class="label" for="username">
          <span class="label-text">Username (3+ characters)</span>
        </label>
        <input type="text" id="username" name="username" required minlength="3"
          class="input input-bordered w-full" />
      </div>

      <div class="form-control">
        <label class="label" for="email">
          <span class="label-text">Email Address</span>
        </label>
        <input type="email" id="email" name="email" required
          class="input input-bordered w-full" />
      </div>

      <div class="form-control">
        <label class="label" for="password">
          <span class="label-text">Password (8+ characters)</span>
        </label>
        <input type="password" id="password" name="password" required minlength="8"
          class="input input-bordered w-full" />
      </div>

      <div class="form-control">
        <label class="label" for="password_confirm">
          <span class="label-text">Confirm Password</span>
        </label>
        <input type="password" id="password_confirm" name="password_confirm" required minlength="8"
          class="input input-bordered w-full" />
      </div>

      <button type="submit" class="btn btn-primary w-full">Create Account</button>
    </form>

    <p class="text-center text-sm">
      Already have an account?
      <a href="/login" class="link link-primary">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
