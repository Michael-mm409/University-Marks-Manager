<div id="course-header-container" class="w-full max-w-4xl p-4 rounded-xl bg-base-100 border border-base-300 flex items-center justify-between gap-4 shadow-sm">
  <div class="flex items-center gap-4">
    <span class="text-sm opacity-70">Active Course</span>
    {% if current_course_id %}
      <span class="text-lg font-semibold">&nbsp;{{ current_course_name or ('#' ~ current_course_id) }}</span>
      {% if current_course_code %}
        <span class="opacity-70 text-sm">&nbsp;{{ current_course_code }}</span>
      {% endif %}
    {% else %}
      <!-- Intentionally blank when no active course is set -->
      <span class="text-sm opacity-70">&nbsp;</span>
    {% endif %}
  </div>
  <div id="course-selector-container" class="flex-shrink-0">
    <select name="course_key" class="select select-md"
            hx-post="/courses/select-inline" hx-target="#course-header-container" hx-swap="outerHTML" hx-trigger="change">
      {% for c in courses %}
        <option value="{{ c.code or c.id }}" {% if current_course_id and (c.id == current_course_id) %}selected{% endif %}>{{ c.name }}{% if c.code %} ({{ c.code }}){% endif %}</option>
      {% endfor %}
    </select>
  </div>
</div>
