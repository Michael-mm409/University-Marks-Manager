<div id="add-semester-card" class="sem-card relative p-5 rounded-lg bg-base-100 border border-base-300 hover:border-primary/70 transition-shadow shadow-sm hover:shadow-md card-glow flex flex-col gap-3 items-center text-center w-full mx-auto" style="max-width: 22rem;">
  <h2 class="text-xl md:text-2xl font-bold">Add Semester</h2>
  <p class="text-xs opacity-70">Create a new term for the selected year</p>
  {% if error %}
    <div role="alert" class="alert alert-error text-xs">
      <span>{{ error }}</span>
    </div>
  {% endif %}
  <form method="post" action="/semester/create"
        hx-post="/semester/create" hx-target="#add-semester-card" hx-swap="outerHTML"
        class="flex flex-wrap gap-3 items-end justify-center w-full">
    <label class="form-control w-40">
      <span class="label-text">Name</span>
      <input name="name" class="input input-bordered input-sm" placeholder="Autumn" value="{{ form_name or '' }}" required />
    </label>
    <label class="form-control w-32">
      <span class="label-text">Year</span>
      <input name="year" type="number" class="input input-bordered input-sm" value="{{ form_year or (selected_year or current_year) }}" min="2000" max="2100" step="1" id="add-semester-year" />
    </label>
    <input type="hidden" name="return_year" value="{{ selected_year or '' }}" />
    <button class="btn btn-sm btn-primary mt-4" type="submit">Add</button>
  </form>
</div>
