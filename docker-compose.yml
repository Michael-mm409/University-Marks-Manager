services:
  web:
    container_name: marks-manager-web
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8001 --proxy-headers --forwarded-allow-ips="*" --reload --reload-dir /app/src --reload-dir /app/src/templates --log-level info --access-log
    restart: unless-stopped
    ports:
      - "8001:8001"
    # network_mode: "host"  <--- REMOVE OR COMMENT THIS OUT
    networks:
      - proxy-tier          # <--- ADD THIS
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      - PYTHONUNBUFFERED=1
      - LOG_FILTER_HEALTHCHECK=true
    volumes:
      - ./:/app
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz').getcode()==200 else 1)\"" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  proxy-tier:
    external: true
