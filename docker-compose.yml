services:
  web:
    container_name: marks-manager-web
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      uvicorn src.app.main:app
      --host 0.0.0.0
      --port 8001
      --proxy-headers
      --forwarded-allow-ips="*"
      --reload
      --reload-dir /app/src
      --reload-dir /app/src/templates
      --log-level info
      --access-log
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - proxy-tier
      - databases_bigdata-net
    env_file:
      - .env
    environment:
          - PYTHONUNBUFFERED=1
          - LOG_FILTER_HEALTHCHECK=true
          - SECRET_PEPPER=${SECRET_PEPPER}
          - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
          - FORWARDED_ALLOW_IPS=*
    volumes:
      - ./:/app:Z
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz').getcode()==200 else 1)\"" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  proxy-tier:
    external: true
  databases_bigdata-net:
    external: true
